<meta name="inppl-build" content="20261003173354279"><!-- inppl-version-check -->
<script>
(() => {
  const versionUrl = new URL('../version.json', location.href);
  const loadedBuild = document.querySelector('meta[name="inppl-build"]')?.content;
  let checking = false;
  async function checkVersion() {
    if (checking || document.hidden || !/^https?:$/.test(location.protocol)) return;
    checking = true;
    try {
      versionUrl.searchParams.set('t', Date.now());
      const response = await fetch(versionUrl, {cache: 'no-store'});
      if (!response.ok) return;
      const data = await response.json();
      if (data.build == null) return;
      const next = String(data.build), current = new URL(location.href);
      if (next !== loadedBuild && current.searchParams.get('v') !== next) {
        current.searchParams.set('v', next);
        location.replace(current.href);
      }
    } catch (_) {} finally { checking = false; }
  }
  checkVersion();
  addEventListener('pageshow', checkVersion);
  document.addEventListener('visibilitychange', checkVersion);
})();
</script>
<!-- /inppl-version-check -->
</head><body><div id="root"></div></body></html>
